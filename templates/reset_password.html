{% extends "base.html" %}
{% block content %}
<section class="center-card small-card">
    <span class="badge">💗 Nouveau départ</span>
    <h1>Nouveau mot de passe</h1>
    <p class="muted">
        Choisis un nouveau mot de passe pour ton compte.
    </p>

    <form method="post" class="form">
        <label>Nouveau mot de passe</label>
        <input type="password" name="password" minlength="6" placeholder="Au moins 6 caractères" required>

        <label>Confirmer le mot de passe</label>
        <input type="password" name="confirm_password" minlength="6" required>

        <button class="btn primary full">Enregistrer le nouveau mot de passe 🔐</button>
    </form>

    <div class="back-login">
        <a href="{{ url_for('login') }}">← Retour à la connexion</a>
    </div>
</section>
{% endblock %}
