{% extends "base.html" %}
{% block content %}
<section class="center-card small-card">
    <span class="badge">🌸 Bienvenue</span>
    <h1>Crée ton espace</h1>
    <p class="muted">Ensuite, on construit ton budget ensemble.</p>

    <form method="post" class="form">
        <label>Nom</label>
        <input name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Mot de passe</label>
        <input type="password" name="password" minlength="6" required>

        <div class="two">
            <div>
                <label>Langue</label>
                <select name="language">
                    <option value="fr">Français</option>
                    <option value="en">English</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
            <div>
                <label>Devise</label>
                <select name="currency">
                    <option>MAD</option><option>EUR</option><option>USD</option>
                    <option>CAD</option><option>SAR</option><option>AED</option>
                </select>
            </div>
        </div>

        <button class="btn primary full">Continuer ✨</button>
    </form>
</section>
{% endblock %}
