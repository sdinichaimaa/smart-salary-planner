<!doctype html>
<html lang="{{ current_lang() }}" dir="{{ 'rtl' if current_lang() == 'ar' else 'ltr' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ t('app_name') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="blob blob-a"></div>
<div class="blob blob-b"></div>

<header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('index') }}">
        <span class="brand-mark">💗</span>
        <span>{{ t('app_name') }}</span>
    </a>

    <div class="top-actions">
        <div class="lang-switch">
            <a href="{{ url_for('set_lang', lang='fr') }}">FR</a>
            <a href="{{ url_for('set_lang', lang='en') }}">EN</a>
            <a href="{{ url_for('set_lang', lang='ar') }}">AR</a>
        </div>

        {% if current_user.is_authenticated %}
            <a class="ghost-btn" href="{{ url_for('categories') }}">{{ t('categories') }}</a>
            <a class="ghost-btn" href="{{ url_for('settings') }}">⚙️</a>
            <a class="ghost-btn" href="{{ url_for('logout') }}">{{ t('logout') }}</a>
        {% endif %}
    </div>
</header>

<main class="page-shell">
    {% with messages = get_flashed_messages() %}
        {% for msg in messages %}
            <div class="flash">{{ msg }}</div>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
